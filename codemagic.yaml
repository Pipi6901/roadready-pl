# Codemagic CI/CD config for RoadReady
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# RoadReady is an Expo MANAGED project (no committed ios/ or android/ native
# folders) — unlike a bare RN app, the native projects don't exist until
# `expo prebuild` generates them on the CI machine. Every workflow below runs
# prebuild before touching Xcode/Gradle. If a native folder is ever committed
# to the repo (`npx expo prebuild` run locally and checked in), delete the
# prebuild step for that platform and this file still works unchanged.
#
# No Firebase and no RevenueCat/Adapty here on purpose — the app currently
# ships with zero environment variables read anywhere in the source
# (grepped, confirmed) and SubscriptionProvider is a local mock behind
# PAYWALL_ENABLED=false (see src/constants/flags.ts, ADR-005 in
# docs/00-decisions.md). Add a `.env` write step and the relevant variable
# group back in once Adapty is actually wired in — copying that boilerplate
# in now would just be dead weight referencing secrets nothing reads.

workflows:
  # =========================================================================
  # iOS — build & upload to TestFlight
  # Triggered on every push to master
  # =========================================================================
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        # Generated by `expo prebuild` from app.json's top-level "name"
        # ("RoadReady") — verify this matches after the first prebuild runs;
        # Xcode project/scheme naming can occasionally differ from the raw
        # app name (e.g. spaces stripped differently).
        XCODE_WORKSPACE: ios/RoadReady.xcworkspace
        XCODE_SCHEME: RoadReady
        # Apple ID of the RoadReady app record in App Store Connect.
        APP_STORE_APPLE_ID: 6795214284
        # Must match app.json's expo.ios.bundleIdentifier exactly.
        BUNDLE_ID: com.astonio.roadready
      groups:
        # Configure this variable group in Codemagic UI:
        # Teams → <team> → Environment variables
        # ---------------------------------------------------------------------
        # "app_store_vars" — APP_STORE_CONNECT_PRIVATE_KEY (.p8 contents),
        # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
        # CERTIFICATE_PRIVATE_KEY (generate with: openssl genrsa 2048)
        - app_store_vars
      node: 20.19.4
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Expo prebuild (iOS)
        script: npx expo prebuild --platform ios --clean --no-install

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing profiles
        script: xcode-project use-profiles

      - name: Force marketing version to 1.0.0
        script: |
          # app.json currently has expo.version 0.1.0 (internal dev value) —
          # first store release should read 1.0.0. Bump app.json yourself
          # once this is no longer the first release, then drop this step.
          cd ios && agvtool new-marketing-version 1.0.0

      - name: Set build number
        script: |
          # Apple's CFBundleVersion must be strictly greater than any prior
          # upload (including Processing / Rejected / Expired). The
          # get-latest-build-number API can be stale for several minutes
          # after upload — relying on it alone causes collisions when
          # builds run back-to-back.
          #
          # Strategy: take MAX(ASC-latest + 1, Codemagic's $BUILD_NUMBER).
          # $BUILD_NUMBER is Codemagic's per-workflow monotonic counter that
          # increments on EVERY triggered build (including failed ones), so
          # it's guaranteed to never go backwards. Using it as a floor
          # survives stale API responses while still picking up any
          # external uploads that the API does report.
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" 2>/dev/null || echo "0")
          NEW_BUILD=$((LATEST + 1))
          if [ "$BUILD_NUMBER" -gt "$NEW_BUILD" ]; then
            NEW_BUILD=$BUILD_NUMBER
          fi
          echo "Setting iOS CFBundleVersion to $NEW_BUILD (ASC latest: $LATEST, Codemagic BUILD_NUMBER: $BUILD_NUMBER)"
          cd ios && agvtool new-version -all $NEW_BUILD

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal
      email:
        recipients:
          - gugalevandrei@gmail.com
        notify:
          success: true
          failure: true

  # =========================================================================
  # Android — build .aab and upload to Play Console internal testing
  # Triggered on every push to master
  # =========================================================================
  android-internal:
    name: Android Internal Testing
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        # Create this keystore reference in Codemagic UI first:
        # Teams → <team> → Code signing identities → Android keystores
        - roadready_keystore
      groups:
        # "google_play_vars" — GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the Play
        # Console service-account JSON, base64-encoded or pasted raw
        # depending on how you wire the publishing block below). This is a
        # Play Console concern, unrelated to Firebase.
        - google_play_vars
      vars:
        # Must match app.json's expo.android.package exactly.
        PACKAGE_NAME: com.astonio.roadready
      node: 20.19.4
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Expo prebuild (Android)
        script: npx expo prebuild --platform android --clean --no-install

      - name: Set Android version code
        script: |
          # versionCode must strictly increase on every Play Console upload.
          # $BUILD_NUMBER is Codemagic's per-workflow monotonic counter —
          # same reasoning as the iOS build-number step above, just simpler
          # since Play Console has no separate "latest build" API to race
          # against here.
          cd android
          sed -i.bak "s/versionCode .*/versionCode $BUILD_NUMBER/" app/build.gradle
          rm app/build.gradle.bak

      - name: Build Android release bundle
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      email:
        recipients:
          - gugalevandrei@gmail.com
        notify:
          success: true
          failure: true
