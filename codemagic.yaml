# TEMPORARY branch: saves the team's iOS signing key as a downloadable artifact
# so the Italian app can reuse the same distribution certificate.
# Manual start only (no triggering block), no publishing. Delete this branch after use.
workflows:
  export-signing-key:
    name: Export signing key (temporary)
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      groups:
        - app_store_vars
    scripts:
      - name: Save the certificate key as an artifact
        script: |
          set -e
          mkdir -p out
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > out/codemagic_certificate_private_key.pem
          head -1 out/codemagic_certificate_private_key.pem
    artifacts:
      - out/*.pem
