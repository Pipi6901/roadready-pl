# Codemagic build for TestFlight — manual code signing.
#
# WHY MANUAL, AND NOT THE USUAL API-KEY SETUP
#
# Codemagic's automatic signing needs an App Store Connect API key of the TEAM
# kind. Only the Account Holder can mint one, and that was not available here.
# An Individual key is not a substitute: Apple signs the two kinds of token
# differently — a team token carries an Issuer ID, an individual one carries no
# issuer at all and marks itself as a user token instead. Codemagic's tools
# build the team form, so an individual key comes back from Apple as
# "401 Authentication credentials are missing or invalid" no matter what role
# the person holding it has. That 401 is what four builds in a row were dying
# on, dressed up as "No matching profiles found".
#
# So nothing here talks to the Apple provisioning API. The certificate and the
# profile are made once by hand and stored in Codemagic; the upload goes over
# an app-specific password instead of a key.
#
# ---------------------------------------------------------------------------
# SET UP ONCE, in Codemagic -> the app -> Environment variables, group
# `ios_signing`, everything marked secure:
#
#   CM_CERTIFICATE          base64 of the distribution .p12
#   CM_CERTIFICATE_PASSWORD the password that .p12 was exported with
#   CM_PROVISIONING_PROFILE base64 of the App Store .mobileprovision
#   APPLE_ID                the Apple account email
#   APP_SPECIFIC_PASSWORD   from appleid.apple.com -> Sign-In and Security
#
# How to produce the first three is written up in the reply that shipped this
# file; the short version is openssl for the key and CSR, the Apple developer
# portal for the certificate and the profile.
# ---------------------------------------------------------------------------

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios_signing
      node: 20.11.1
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.astonio.roadreadypl"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Check the signing variables are set
        # Cheap, and it turns a missing variable into a one-line message here
        # instead of an opaque keychain error twenty minutes in.
        script: |
          missing=""
          for v in CM_CERTIFICATE CM_CERTIFICATE_PASSWORD CM_PROVISIONING_PROFILE APPLE_ID APP_SPECIFIC_PASSWORD; do
            eval "value=\$$v"
            if [ -z "$value" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing environment variables:$missing"
            echo "Add them to the ios_signing group in Codemagic and rebuild."
            exit 1
          fi
          echo "All five signing variables are present."

      - name: Install dependencies
        script: npm ci

      - name: Typecheck
        # Cheap, and it catches the class of breakage that otherwise costs a
        # 30-minute build to discover.
        script: ./node_modules/.bin/tsc --noEmit

      - name: Generate the native iOS project
        # Expo managed project: there is no ios/ directory in the repository,
        # it is produced here and thrown away afterwards. A workflow that skips
        # this fails at the first Xcode command.
        script: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set the build number
        # $BUILD_NUMBER is Codemagic's own counter, so it always goes up.
        # App Store Connect rejects a build whose number it has seen before,
        # and that rejection arrives after the upload, not before it.
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER

      - name: Install the certificate and the profile
        script: |
          set -e
          keychain initialize

          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode \
            > "$PROFILES_DIR/roadready.mobileprovision"

          xcode-project use-profiles

      - name: Build the ipa
        # The workspace name comes from the app name in app.json, so it is
        # derived rather than hardcoded — renaming the app would otherwise
        # break the build in a way that reads as a signing error.
        script: |
          set -e
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace: $WORKSPACE / scheme: $SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"

      - name: Upload to TestFlight
        # Not `publishing.app_store_connect`, which only authenticates with an
        # API key. altool takes an Apple ID and an app-specific password, which
        # is the whole point of this file.
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
