# Codemagic build for TestFlight.
#
# Two things here are deliberate and easy to undo by accident.
#
# 1. There is only ONE workflow. A second, diagnostic one existed for a while
#    and was simply never picked from the dropdown, so three builds in a row
#    reported the same signing error with no diagnostics attached. The checks
#    now run inside the build people actually start.
#
# 2. There is no `environment.ios_signing:` block. Codemagic resolves that
#    during workflow setup, before the first script — so when signing fails
#    there the build dies with "No matching profiles found" and nothing else,
#    and no amount of logging added to the scripts is ever reached. Signing is
#    done explicitly below, after the checks have printed what Apple actually
#    thinks of our credentials.
#
# Prerequisites in Codemagic:
#   Settings -> Integrations -> Developer Portal -> Manage keys: add an App
#   Store Connect API key named exactly RoadReadyPL. It must be a TEAM key,
#   not an Individual one — individual keys have no access to certificates and
#   profiles at all, which produces exactly the failure above.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: RoadReadyPL

    environment:
      node: 20.11.1
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.astonio.roadreadypl"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      # -- Diagnosis first: it costs seconds, and it is the only thing that
      #    separates the four causes the signing error lumps together.
      - name: 1. Did the credentials reach the build
        script: |
          echo "ISSUER ID present  : ${APP_STORE_CONNECT_ISSUER_ID:+yes}"
          echo "KEY ID present     : ${APP_STORE_CONNECT_KEY_IDENTIFIER:+yes}"
          echo "PRIVATE KEY present: ${APP_STORE_CONNECT_PRIVATE_KEY:+yes}"
          echo "KEY ID value       : ${APP_STORE_CONNECT_KEY_IDENTIFIER:-(empty)}"
          echo
          echo "All three must say yes. If they do not, the integration named"
          echo "in this file does not match the key added in Codemagic."

      - name: 2. Does Apple accept them
        script: |
          echo "--- bundle ids on this account ---"
          app-store-connect bundle-ids list || true
          echo
          echo "401 here means the key data is wrong: Issuer ID and Key ID"
          echo "swapped, the wrong .p8 uploaded, or an Individual key instead"
          echo "of a Team key. An empty list with no error means the key works"
          echo "but sees a different Apple team than the one holding the app."

      - name: 3. Is there anything to sign with
        script: |
          echo "--- distribution certificates ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
          echo
          echo "--- app store profiles ---"
          app-store-connect profiles list --type IOS_APP_STORE || true
          echo
          echo "Both empty on a working key means the key cannot create them:"
          echo "its role is below App Manager."

      - name: Install dependencies
        script: npm ci

      - name: Typecheck
        # Cheap, and it catches the class of breakage that otherwise costs a
        # 30-minute build to discover.
        script: ./node_modules/.bin/tsc --noEmit

      - name: Generate the native iOS project
        # Expo managed project: there is no ios/ directory in the repository,
        # it is produced here and thrown away afterwards. A workflow that skips
        # this fails at the first Xcode command.
        script: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set the build number
        # $BUILD_NUMBER is Codemagic's own counter, so it always goes up.
        # App Store Connect rejects a build whose number it has seen before,
        # and that rejection arrives after the upload, not before it.
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER

      - name: Sign
        # fetch-signing-files needs a private key to pair the certificate with.
        # Without one it fails on "Cannot save Signing Certificates without
        # certificate private key", which reads like a permissions problem and
        # is not.
        #
        # Reusing one key matters: a fresh key means a fresh certificate every
        # build, and Apple allows three distribution certificates in total. So
        # once the first build has produced one, save it into Codemagic as the
        # secure variable CERTIFICATE_PRIVATE_KEY and this stops minting more.
        script: |
          set -e
          keychain initialize

          KEY_PATH=/tmp/ios_distribution_key.pem
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Using the certificate private key from the environment."
            echo "$CERTIFICATE_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo "No CERTIFICATE_PRIVATE_KEY set — generating one for this build."
            ssh-keygen -t rsa -b 2048 -m PEM -f "$KEY_PATH" -q -N ""
            rm -f "$KEY_PATH.pub"
          fi

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$KEY_PATH" \
            --create

          keychain add-certificates
          xcode-project use-profiles

      - name: Build the ipa
        # The workspace name comes from the app name in app.json, so it is
        # derived rather than hardcoded — renaming the app would otherwise
        # break the build in a way that reads as a signing error.
        script: |
          set -e
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace: $WORKSPACE / scheme: $SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Internal testers only. Flip to an external group once the debug
        # screen in the onboarding funnel is gone and the privacy policy is
        # published — an external group goes through Beta App Review, and both
        # of those are what it would fail on.
        submit_to_testflight: true
