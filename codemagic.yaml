# Codemagic build for TestFlight.
#
# WHERE THE CREDENTIALS COME FROM
#
# The App Store Connect key is supplied as plain environment variables in the
# Codemagic variable group `app_store_vars`, not through the Developer Portal
# integration. That distinction cost several builds: a workflow that names an
# integration, or the wrong group, never gets APP_STORE_CONNECT_* into scope,
# so the CLI sends an unsigned request and Apple answers
# "401 Authentication credentials are missing or invalid" — which Codemagic
# then reports at the top of the build as "No matching profiles found".
#
# The group must provide:
#   APP_STORE_CONNECT_ISSUER_ID       UUID, one per Apple team
#   APP_STORE_CONNECT_KEY_IDENTIFIER  10 characters, one per key
#   APP_STORE_CONNECT_PRIVATE_KEY     the .p8, an EC key
#   CERTIFICATE_PRIVATE_KEY           an RSA key, paired with the signing
#                                     certificate. Keeping one and reusing it
#                                     is what stops every build minting a new
#                                     distribution certificate — Apple allows
#                                     three in total.
#   APP_STORE_APP_ID                  numeric id of the app, used on publish
#
# There is deliberately no `environment.ios_signing:` block. Codemagic resolves
# that during workflow setup, before the first script, so a failure there kills
# the build with one line and no diagnostics — nothing added to the scripts is
# ever reached. Signing happens explicitly below instead.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - app_store_vars
      node: 20.11.1
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.astonio.roadreadypl"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Check the credentials are in scope
        # Seconds, and it turns "the variable group is not attached" into a
        # first-step message instead of a 401 twenty minutes in.
        script: |
          missing=""
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            eval "value=\$$v"
            if [ -z "$value" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing:$missing"
            echo "The app_store_vars group is not attached to this workflow."
            exit 1
          fi
          echo "Issuer ID : $APP_STORE_CONNECT_ISSUER_ID"
          echo "Key ID    : $APP_STORE_CONNECT_KEY_IDENTIFIER"

          # Shape checks, not contents. Apple answers a malformed key with the
          # same 401 it uses for a revoked one, so the only way to tell them
          # apart is to look at what we are about to send, before sending it.
          problems=$(mktemp)

          case "$APP_STORE_CONNECT_ISSUER_ID" in
            ????????-????-????-????-????????????) ;;
            *) echo "  ISSUER_ID is not a UUID: expected 8-4-4-4-12, got ${#APP_STORE_CONNECT_ISSUER_ID} characters" >> "$problems" ;;
          esac

          if [ ${#APP_STORE_CONNECT_KEY_IDENTIFIER} -ne 10 ]; then
            echo "  KEY_IDENTIFIER should be 10 characters, got ${#APP_STORE_CONNECT_KEY_IDENTIFIER}" >> "$problems"
          fi

          # The .p8 is a PEM block. Pasted as one line, or base64-encoded
          # first, it still arrives as a non-empty string and still signs
          # something Apple refuses. This is the commonest cause of the 401.
          p8_lines=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | wc -l | tr -d ' ')
          case "$APP_STORE_CONNECT_PRIVATE_KEY" in
            "-----BEGIN PRIVATE KEY-----"*)
              if [ "$p8_lines" -lt 2 ]; then
                echo "  PRIVATE_KEY is one line: the .p8 lost its line breaks when it was pasted" >> "$problems"
              fi
              ;;
            *)
              echo "  PRIVATE_KEY does not begin with -----BEGIN PRIVATE KEY-----" >> "$problems"
              echo "  Paste the .p8 exactly as downloaded, not base64-encoded" >> "$problems"
              ;;
          esac

          case "$CERTIFICATE_PRIVATE_KEY" in
            "-----BEGIN "*"PRIVATE KEY-----"*) ;;
            *) echo "  CERTIFICATE_PRIVATE_KEY is not a PEM private key" >> "$problems" ;;
          esac

          if [ -s "$problems" ]; then
            echo
            echo "The credentials are in scope but malformed:"
            cat "$problems"
            echo
            echo "Apple reports every one of these as 401, credentials missing or invalid."
            exit 1
          fi

          echo "p8 line breaks: $p8_lines"
          echo "All four credentials are in scope and well-formed."

      - name: Does Apple accept them
        # A 401 here is about the key itself, not about profiles, and saying so
        # before the build starts saves half an hour of chasing the wrong thing.
        script: app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID"

      - name: Install dependencies
        script: npm ci

      - name: Typecheck
        # Cheap, and it catches the class of breakage that otherwise costs a
        # 30-minute build to discover.
        script: ./node_modules/.bin/tsc --noEmit

      - name: Generate the native iOS project
        # Expo managed project: there is no ios/ directory in the repository,
        # it is produced here and thrown away afterwards. A workflow that skips
        # this fails at the first Xcode command.
        script: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set the build number
        # $BUILD_NUMBER is Codemagic's own counter, so it always goes up.
        # App Store Connect rejects a build whose number it has seen before,
        # and that rejection arrives after the upload, not before it.
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER

      - name: Sign
        # --create registers the bundle id and issues the profile if they do
        # not exist yet; --certificate-key supplies the RSA key the certificate
        # is paired with. Without that key this fails on "Cannot save Signing
        # Certificates without certificate private key", which reads like a
        # permissions problem and is not.
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the ipa
        # The workspace name comes from the app name in app.json, so it is
        # derived rather than hardcoded — renaming the app would otherwise
        # break the build in a way that reads as a signing error.
        script: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace: $WORKSPACE / scheme: $SCHEME"

          if xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"; then
            exit 0
          fi

          # xcodebuild reports "Failed to archive" and exit 65 for every kind of
          # compile failure alike; the line that actually says what broke is in
          # its own log file, which otherwise only reaches the artifacts zip.
          echo "=================== what actually failed ==================="
          for f in /tmp/xcodebuild_logs/*.log; do
            [ -f "$f" ] || continue
            echo "--- errors in $(basename "$f") ---"
            grep -nE "error:|fatal error|The following build commands failed|Undefined symbol" "$f" | tail -40 || true
            echo "--- last 80 lines of $(basename "$f") ---"
            tail -80 "$f"
          done
          exit 1

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Same key as above, passed explicitly because this workflow uses
        # variables rather than a Developer Portal integration.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Nothing else here on purpose.
        #
        # Uploading is all internal testing needs: App Store Connect processes
        # the build and the internal group has it, with no review. The comment
        # that used to sit here said "internal testers only" directly above
        # submit_to_testflight: true, which means the opposite — it submits for
        # EXTERNAL testing, that goes through Beta App Review, and the review
        # refuses a build whose Test Information is empty. So a build that had
        # compiled, uploaded and finished processing was reported as failed.
        #
        # To add external testers later: fill in Test Information in App Store
        # Connect (feedback email, and a contact name, phone and email), then
        # add submit_to_testflight: true with a beta_groups list.
