# Codemagic build for TestFlight.
#
# The one thing that is not standard here: this is an Expo managed project, so
# there is no ios/ directory in the repository. It is generated by
# `expo prebuild` during the build and thrown away afterwards. A workflow that
# skips that step fails at the very first Xcode command, which is the usual way
# an Expo project fails on CI.
#
# Prerequisites in Codemagic:
#   Teams -> Integrations -> Apple Developer Portal -> add an App Store Connect
#   API key (.p8 + Issuer ID + Key ID) and name it exactly as `integrations`
#   references it below. That single key covers both code signing and the
#   TestFlight upload.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Rename if the key in Codemagic is called something else.
      app_store_connect: RoadReadyPL

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.astonio.roadreadypl
      node: 20.11.1
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Typecheck
        # Cheap, and it catches the class of breakage that otherwise costs a
        # 30-minute build to discover.
        script: ./node_modules/.bin/tsc --noEmit

      - name: Generate the native iOS project
        # --no-install because CocoaPods is handled in the next step, with
        # Codemagic's own caching.
        script: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set the build number
        # $BUILD_NUMBER is Codemagic's own counter, so it always goes up.
        # App Store Connect rejects a build whose number it has seen before,
        # and that rejection arrives after the upload, not before it.
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build the ipa
        # The workspace name comes from the app name in app.json, so it is
        # derived rather than hardcoded — renaming the app would otherwise
        # break the build in a way that reads as a signing error.
        script: |
          set -e
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace: $WORKSPACE / scheme: $SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Internal testers only. Flip to an external group once the debug
        # screen in the onboarding funnel is gone and the privacy policy is
        # published — an external group goes through Beta App Review, and both
        # of those are what it would fail on.
        submit_to_testflight: true
